# Unit tests for the pure node logic under imagenode/sentinelcam — code that
# takes inputs and makes decisions, with no sockets, devices, or child
# processes. The transport and hardware layers are tested by deployment.
#
# Collection is pinned to tests/sentinelcam: the rest of tests/ is upstream
# imagenode's manual hardware test programs, which are not pytest tests.
[pytest]
testpaths = tests/sentinelcam
pythonpath = imagenode
